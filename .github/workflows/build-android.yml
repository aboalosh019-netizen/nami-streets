name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot & Export Templates (4.7.2)
        run: |
          GODOT_VER="4.7.2-stable"
          TEMPLATE_DIR_VER="4.7.2.stable"
          mkdir -p /tmp/godot /root/.local/share/godot/export_templates/${TEMPLATE_DIR_VER}

          curl -fSL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VER}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          curl -fSL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz" -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          mv /tmp/godot/tpl/templates/* /root/.local/share/godot/export_templates/${TEMPLATE_DIR_VER}/

      - name: Generate Android debug keystore
        run: |
          mkdir -p /root/.android build
          keytool -genkey -v -keystore /root/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Ensure export_presets.cfg exists
        run: |
          if [ ! -f export_presets.cfg ]; then
            cat << 'PRESET_EOF' > export_presets.cfg
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/nami-streets-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86_64=false
architectures/x86=false
package/unique_name="com.namistreets.game"
package/name="Nami Streets"
version/code=1
version/name="1.0.0"
screen/orientation=0
permissions/vibrate=true
permissions/internet=false
keystore/debug="/root/.android/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
PRESET_EOF
          fi

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/nami-streets-debug.apk
          ls -lh build/nami-streets-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nami-streets-android-apk
          path: build/nami-streets-debug.apk
