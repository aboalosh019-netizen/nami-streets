name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 and export templates
        run: |
          GODOT_VER="4.7.2-stable"
          TEMPLATE_VER="4.7.2.stable"
          mkdir -p /tmp/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VER"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VER}_linux.x86_64" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz" -o /tmp/godot/templates.tpz
          mkdir -p /tmp/godot/templates
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/templates
          cp -a /tmp/godot/templates/templates/. "$HOME/.local/share/godot/export_templates/$TEMPLATE_VER/"

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/nami-streets-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=1

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_64=false
          architectures/x86=false
          package/unique_name="com.namistreets.game"
          package/name="Nami Streets"
          version/code=1
          version/name="1.0.0"
          screen/orientation=0
          permissions/vibrate=true
          permissions/internet=false
          PRESET
          mkdir -p build

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/nami-streets-debug.apk
          test -s build/nami-streets-debug.apk
          ls -lh build/nami-streets-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nami-streets-android-apk
          path: build/nami-streets-debug.apk
          if-no-files-found: error
